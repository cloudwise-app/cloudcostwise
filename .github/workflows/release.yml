name: release
# Tag vX.Y.Z (pushed with the export) -> build -> PyPI (trusted publishing,
# no stored token) -> MCP registry (GitHub OIDC, no stored token) -> the GitHub
# release entry for the tag, with the notes the export wrote.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
          python -c "import json;assert json.load(open('server.json'))['version']=='$version'"
      - run: pip install build pytest . && pytest tests -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP registry (retries while PyPI propagates)
        run: |
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 60; done; exit 1
  github-release:
    # After PyPI, so the entry never names a version nobody can install. A failure here
    # leaves PyPI and the registry published; rerun this job or create the entry by hand.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release entry for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as it is"; exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "cloudcostwise $version" --notes-file .github/release-notes.md --latest --verify-tag
