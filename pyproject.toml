[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcostwise"
version = "0.1.6"
description = "Find AWS waste from your terminal or your AI assistant. Runs locally with your own read-only credentials. Nothing is sent to CloudWise."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["aws", "finops", "cost-optimization", "cloud-cost", "waste", "mcp", "claude-code", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
license = { text = "FSL-1.1-ALv2" }
authors = [{ name = "CloudWise" }]
dependencies = ["boto3>=1.40", "mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cloudcostwise = "cloudcostwise.cli:main"

[project.urls]
Homepage = "https://cloudcostwise.io/cli"
Repository = "https://github.com/cloudwise-app/cloudcostwise"
Issues = "https://github.com/cloudwise-app/cloudcostwise/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudwise_scan_core = ["py.typed"]
