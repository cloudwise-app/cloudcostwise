[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcostwise"
version = "0.1.29"
description = "Find AWS waste from your terminal or your AI assistant, including kinds AWS's own tools don't flag. Runs locally with your own read-only credentials. Nothing is sent to CloudWise unless you choose to share a summary at the end."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["aws", "finops", "cost-optimization", "cloud-cost", "waste", "mcp", "claude-code", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE"]
authors = [{ name = "CloudWise" }]
dependencies = ["boto3>=1.40", "mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cloudcostwise = "cloudcostwise.cli:main"

[project.urls]
Homepage = "https://cloudcostwise.io/cli"
Repository = "https://github.com/cloudwise-app/cloudcostwise"
Issues = "https://github.com/cloudwise-app/cloudcostwise/issues"

[tool.uv]
# The plugin starts with `uv run --locked`: uv.lock fixes the runtime dependencies, this fixes the build
# tool. Without it the first start downloads the newest setuptools. Move these pins at a release
# (docs/ops/open-core-publish.md), after the export builds with the new version.
build-constraint-dependencies = ["setuptools==84.2.1", "wheel==0.48.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudwise_scan_core = ["py.typed"]
cloudcostwise = ["demo_scan.json"]
